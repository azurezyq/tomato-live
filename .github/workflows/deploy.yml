name: Test & Deploy Tomato Live

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-east1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'tomato-live-stt-proxy' }}

jobs:
  test:
    name: Typecheck & Automated Tests
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check-secrets.outputs.can_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test

      - name: Check deployment secrets
        id: check-secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy jobs: configure GCP_SA_KEY secret to enable auto-deploy."
          fi

  deploy-stt-proxy:
    name: Deploy STT & Vertex AI Proxy (Cloud Run)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ needs.test.outputs.can_deploy == 'true' }}
    outputs:
      ws_url: ${{ steps.derive-ws.outputs.ws_url }}
      hosting_site: ${{ steps.ensure-site.outputs.site_id }}
      project_id: ${{ steps.resolve-project.outputs.project_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve GCP / Firebase Project ID
        id: resolve-project
        env:
          VAR_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          AUTH_PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          PROJECT="${VAR_PROJECT:-$AUTH_PROJECT}"
          if [ -z "$PROJECT" ]; then
            echo "Error: Could not determine GCP project ID. Set vars.FIREBASE_PROJECT_ID or include project_id in GCP_SA_KEY."
            exit 1
          fi
          echo "::add-mask::${PROJECT}"
          echo "project_id=${PROJECT}" >> "$GITHUB_OUTPUT"

      - name: Ensure Firebase Hosting site
        id: ensure-site
        env:
          PROJECT: ${{ steps.resolve-project.outputs.project_id }}
          CUSTOM_SITE: ${{ secrets.FIREBASE_HOSTING_SITE || vars.FIREBASE_HOSTING_SITE }}
        run: |
          if [ -n "$CUSTOM_SITE" ]; then
            TOKEN=$(gcloud auth print-access-token)
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" \
              "https://firebasehosting.googleapis.com/v1beta1/projects/${PROJECT}/sites/${CUSTOM_SITE}")
            if [ "$CODE" != "200" ]; then
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d '{}' \
                "https://firebasehosting.googleapis.com/v1beta1/projects/${PROJECT}/sites?siteId=${CUSTOM_SITE}" || true
            fi
            CHOSEN="$CUSTOM_SITE"
          else
            CHOSEN="$PROJECT"
          fi
          echo "::add-mask::${CHOSEN}"
          echo "site_id=${CHOSEN}" >> "$GITHUB_OUTPUT"

      - name: Deploy services/stt-proxy to Cloud Run
        id: deploy-run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          source: ./services/stt-proxy
          env_vars: |
            USE_VERTEX_AI=true
            VERTEX_LOCATION=${{ vars.VERTEX_LOCATION || 'global' }}
            STT_MODEL=gemini-3.5-transcribe-live
            GOOGLE_CLOUD_PROJECT=${{ steps.resolve-project.outputs.project_id }}
            ALLOWED_ORIGINS=https://${{ steps.ensure-site.outputs.site_id }}.web.app;https://${{ steps.ensure-site.outputs.site_id }}.firebaseapp.com;https://${{ steps.resolve-project.outputs.project_id }}.web.app;https://${{ steps.resolve-project.outputs.project_id }}.firebaseapp.com
            ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS || vars.ALLOWED_EMAILS }}
            MAX_DAILY_TURNS=${{ vars.MAX_DAILY_TURNS || '1000' }}
          flags: >-
            --allow-unauthenticated
            --timeout=3600
            --session-affinity
            --max-instances=1

      - name: Derive WebSocket URL
        id: derive-ws
        run: |
          SERVICE_URL="${{ steps.deploy-run.outputs.url }}"
          WS_URL="${SERVICE_URL/https:\/\//wss://}/ws/stt"
          echo "::add-mask::${SERVICE_URL}"
          echo "::add-mask::${WS_URL}"
          echo "ws_url=${WS_URL}" >> "$GITHUB_OUTPUT"

  deploy-firebase:
    name: Deploy Web App & Firestore Rules (Firebase)
    needs: [test, deploy-stt-proxy]
    runs-on: ubuntu-latest
    if: ${{ needs.test.outputs.can_deploy == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app with Firebase & Cloud Run WS config
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || format('{0}.firebaseapp.com', needs.deploy-stt-proxy.outputs.project_id) }}
          VITE_FIREBASE_PROJECT_ID: ${{ needs.deploy-stt-proxy.outputs.project_id }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || format('{0}.firebasestorage.app', needs.deploy-stt-proxy.outputs.project_id) }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AI_BACKEND: ${{ vars.VITE_FIREBASE_AI_BACKEND || 'vertexai' }}
          VITE_VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'global' }}
          VITE_STT_WS_URL: ${{ needs.deploy-stt-proxy.outputs.ws_url }}
        run: npm run build --workspace=apps/web

      - name: Authenticate to Google Cloud for Firebase CLI
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firebase Hosting & Firestore Rules
        env:
          HOSTING_SITE: ${{ needs.deploy-stt-proxy.outputs.hosting_site }}
          PROJECT_ID: ${{ needs.deploy-stt-proxy.outputs.project_id }}
        run: |
          echo "::add-mask::${HOSTING_SITE}"
          echo "::add-mask::${PROJECT_ID}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
            cfg.hosting.site = process.env.HOSTING_SITE;
            fs.writeFileSync('firebase.json', JSON.stringify(cfg, null, 2));
          "
          npx firebase-tools@latest deploy \
            --only hosting,firestore:rules \
            --project "${PROJECT_ID}" \
            --non-interactive
